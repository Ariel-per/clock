<!DOCTYPE html>
<!--
  LINE 打卡頁（放在 GitHub Pages）
  1. 在 GitHub 建一個 repo，把這個檔案改名為 index.html 上傳，Settings → Pages 開啟。
  2. LINE Developers 建立「LINE Login」頻道 → LIFF 分頁 → Add：
       Size：Full ／ Endpoint URL：GitHub Pages 網址 ／ Scopes：勾 openid、profile
  3. 把 LIFF ID 和 Apps Script 的 API 網址填進最下面的 CONFIG。
  4. 打卡後台 → 設定 → 填入 LINE Login 頻道的 Channel ID。
  5. LINE 官方帳號圖文選單的連結設成 https://liff.line.me/你的LIFF_ID
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打卡</title>
<style>
:root{
  --bg:#eef1f5; --card:#fff; --ink:#1c2430; --muted:#6b7585; --line:#dde2ea; --soft:#f5f7fa;
  --primary:#1f4fd1; --navy:#1d2b44; --ok:#1f7a4d; --ok-bg:#e5f4ec; --bad:#b42318; --bad-bg:#fdecea;
  --warn:#a6560f; --warn-bg:#fdf1e3; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
h2{font-size:15px;margin:0 0 10px;font-weight:600}

.top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:600}
.logo{width:22px;height:22px;border-radius:6px;background:var(--navy);display:grid;place-items:center}
.logo:after{content:"";width:8px;height:8px;border-radius:50%;border:2px solid #fff}
.link{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 6px}
.link:hover{color:var(--ink)}

.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.big{width:100%;padding:14px;font-size:17px;border-radius:11px}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ---- 員工端 ---- */
.emp{max-width:460px;margin:0 auto;padding:18px 14px 40px}
.clock{text-align:center;padding:18px 0 22px}
.clk{font-size:58px;font-weight:600;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;line-height:1}
.clkdate{color:var(--muted);margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.namelist{display:flex;flex-direction:column;gap:8px}
.namelist button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:12px 14px;cursor:pointer;font-size:16px}
.namelist button:hover{border-color:var(--primary)}
.who{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.whoname{font-size:19px;font-weight:600}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tbox{background:var(--soft);border-radius:9px;padding:10px 12px}
.tbox span{display:block;font-size:13px;color:var(--muted)}
.tbox b{font-size:22px;font-variant-numeric:tabular-nums}
.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.pick{width:100%;font-size:17px;padding:11px;border:1px solid var(--line);border-radius:9px;margin-bottom:12px;background:var(--card)}
.pin{width:100%;font-size:24px;letter-spacing:10px;text-align:center;padding:10px;border:1px solid var(--line);border-radius:9px;margin-bottom:12px;background:var(--card)}
.hint{margin:12px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
.result{border-radius:9px;padding:12px 14px;margin-bottom:14px}
.result b{display:block;font-size:16px}
#bindInfo,#bindErr{margin-bottom:12px}
.result.ok{background:var(--ok-bg);color:var(--ok);border:1px solid #bfe2cf}
.result.err{background:var(--bad-bg);color:var(--bad);border:1px solid #f5c6c0}
.weekhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.weekhead h2{margin:0}
.weeknav{display:flex;align-items:center;gap:6px;font-size:14px}
.weeknav button{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:3px 9px;cursor:pointer}

/* ---- 表格 ---- */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.grid th,.grid td{text-align:center;padding:5px 3px;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid th{font-weight:500;color:var(--muted);font-size:12px}
.grid th.today{color:var(--primary);font-weight:700}
.grid td.nm{text-align:left;padding-left:2px;padding-right:8px;font-weight:500}
.grid tr.me td.nm{color:var(--primary);font-weight:700}
.grid tr.me td{border-bottom-color:var(--primary)}
.chip{display:inline-block;min-width:26px;padding:2px 4px;border-radius:5px;font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* ---- 管理端 ---- */
.adm{max-width:1180px;margin:0 auto;padding:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--navy);font-weight:600}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar .sp{flex:1}
.bar input,.bar select{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--card)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat span{font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.list th,.list td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
.list th{background:var(--soft);font-weight:500;color:var(--muted);font-size:13px}
.list tr:last-child td{border-bottom:0}
.list td.num,.list th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;background:var(--soft);color:var(--muted)}
.tag.正常{background:var(--ok-bg);color:var(--ok)}
.tag.遲到,.tag.早退{background:var(--warn-bg);color:var(--warn)}
.tag.未打卡{background:var(--bad-bg);color:var(--bad)}
.tag.上班{background:#e6edfc;color:var(--primary)}
.tag.下班{background:#e7e9ee;color:var(--navy)}

.sched{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px}
.sched th,.sched td{padding:0;border:1px solid var(--line);font-size:12px;text-align:center;min-width:30px}
.sched th{padding:4px 2px;font-weight:500;color:var(--muted);background:var(--soft)}
.sched th.we{color:var(--bad)}
.sched th small{display:block;font-size:10px}
.sched td.nm{text-align:left;padding:4px 10px;font-weight:500;font-size:13px;white-space:nowrap;background:var(--card);position:sticky;left:0}
.sched td.c{cursor:pointer;height:30px;user-select:none}
.sched td.c:hover{outline:2px solid var(--navy);outline-offset:-2px}
.sched td.chg{box-shadow:inset 0 0 0 2px var(--primary)}
.savebar{position:sticky;bottom:12px;display:flex;justify-content:center;margin-top:12px}
.savebar .btn{box-shadow:0 4px 14px rgba(29,43,68,.25)}

.form{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.form h3{margin:0 0 14px;font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card)}
.f textarea{min-height:76px;resize:vertical}
.f.full{grid-column:1/-1}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:5px 11px;cursor:pointer}
.days button.on{background:#e6edfc;border-color:#9fb6ef;color:var(--primary)}
.check{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:6px 0}
.check small{display:block;color:var(--muted)}
.check input{width:20px;height:20px;flex:none}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.shiftrow{display:grid;grid-template-columns:70px 1fr 100px 100px 50px 36px;gap:8px;margin-bottom:8px;align-items:center}
.shiftrow input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.shiftrow input[type=color]{padding:2px;height:36px}

.modal{position:fixed;inset:0;background:rgba(20,28,40,.45);display:grid;place-items:center;z-index:20;padding:16px}
.sheetbox{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.sheetbox h3{margin:0 0 14px}
.sheetbox .f{margin-bottom:12px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:9px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.show{opacity:1}
.loading{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:700px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.adm{padding:12px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo"></span><span id="company">打卡</span></div>
  <span class="muted" id="lineName" style="font-size:13px"></span>
</header>

<main class="emp">
  <section class="clock">
    <div id="clk" class="clk">--:--:--</div>
    <div id="clkDate" class="clkdate">&nbsp;</div>
  </section>

  <div id="loadingCard" class="loading">連線中…</div>
  <div id="fatal" class="result err hidden"></div>

  <section class="card hidden" id="bindCard">
    <h2>綁定你的 LINE</h2>
    <p class="note" style="margin:0 0 14px">第一次使用：選自己的名字、輸入 PIN。綁定後從 LINE 打開就直接是你的打卡頁，換手機也不用重綁（同一個 LINE 帳號）。</p>
    <div id="bindInfo" class="result err hidden"></div>
    <label class="lbl" for="bindEmp">姓名</label>
    <select id="bindEmp" class="pick"></select>
    <label class="lbl" for="bindPin">PIN（4–8 位數字，向管理員索取）</label>
    <input id="bindPin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
    <div id="bindErr" class="result err hidden"></div>
    <button id="bindBtn" class="btn dark big">綁定</button>
  </section>

  <section class="card hidden" id="punchCard">
    <div id="result" class="result hidden"></div>
    <div class="who">
      <div><div id="whoName" class="whoname"></div><div id="whoShift" class="muted"></div></div>
      <span class="tag 正常">LINE 已綁定</span>
    </div>
    <div class="times">
      <div class="tbox"><span>今日上班</span><b id="tIn">--:--</b></div>
      <div class="tbox"><span>今日下班</span><b id="tOut">--:--</b></div>
    </div>
    <button id="clockBtn" class="btn primary big">上班打卡</button>
    <ul class="hint">
      <li>打卡時間以伺服器為準</li>
      <li id="gpsHint" class="hidden"></li>
      <li>綁錯人請找管理員解除綁定</li>
    </ul>
  </section>
</main>

<div id="modal" class="modal hidden"><div class="sheetbox" id="modalBody"></div></div>
<div id="toast"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<script>
/* ===================== 設定：只要改這兩行 ===================== */
const CONFIG = {
  LIFF_ID: '2012602172-nLyUZ89B',              // LINE Developers → LIFF 分頁，例如 2001234567-AbCdEfGh
  API: 'https://script.google.com/macros/s/AKfycby5HBTqICTnC67FkYqGi2gGRIQ7H_UAFavtOkGRt_PBCAUH4xMpZq-1cu0c_mwtHk6H/exec'       // 後台「設定」→「API 網址」，結尾是 /exec
};
/* ============================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function only(id){ ['loadingCard','bindCard','punchCard'].forEach(x=>$('#'+x).classList.toggle('hidden', x!==id)); }
function fatal(msg){ $('#loadingCard').classList.add('hidden'); const f=$('#fatal'); f.textContent=msg; f.classList.remove('hidden'); }
function openModal(html){ $('#modalBody').innerHTML=html; $('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); }

/* 時鐘：依伺服器時間 */
let offset=0;
const fT=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
const fD=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'long',day:'numeric',weekday:'short'});
function tick(){ const n=new Date(Date.now()+offset); $('#clk').textContent=fT.format(n); $('#clkDate').textContent=fD.format(n); }
tick(); setInterval(tick,1000);

/* 呼叫 Apps Script（用 text/plain 送出，避免跨網域預檢） */
async function api(action, data){
  const idToken = liff.getIDToken();
  const r = await fetch(CONFIG.API, { method:'POST', body: JSON.stringify(Object.assign({ action, idToken }, data||{})) });
  let j; try{ j = await r.json(); }catch(e){ throw new Error('伺服器沒有回應，請確認 API 網址與部署設定'); }
  if(!j.ok){
    const m=String(j.error||'發生錯誤');
    if(m.startsWith('TOKEN:')){ toast('LINE 登入已過期，重新載入中…'); setTimeout(()=>location.reload(),900); throw new Error(m.slice(6)); }
    throw new Error(m);
  }
  if(j.data && j.data.now) offset = j.data.now - Date.now();
  return j.data;
}

let me=null, info=null;

async function start(){
  if(CONFIG.LIFF_ID.startsWith('請') || CONFIG.API.startsWith('請')) return fatal('還沒設定 LIFF_ID 或 API 網址（在這個檔案最下面的 CONFIG）。');
  try{
    await liff.init({ liffId: CONFIG.LIFF_ID });
  }catch(e){ return fatal('LINE 初始化失敗：'+(e.message||e)); }
  if(!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
  if(!liff.getIDToken()) return fatal('拿不到 LINE 身分。請管理員在 LIFF 設定把 Scopes 的 openid 打勾。');
  try{
    info = await api('me');
    $('#company').textContent = info.company || '打卡';
    document.title = (info.company||'') + ' 打卡';
    $('#lineName').textContent = info.lineName || '';
    if(info.me){ me=info.me; showStatus(); only('punchCard'); return; }
    $('#bindEmp').innerHTML = '<option value="">請選擇</option>' + info.emps.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('');
    only('bindCard');
  }catch(err){ fatal(String(err.message||err)); }
}

/* 綁定 */
function askConfirm(title, text, okLabel){
  return new Promise(res => {
    openModal(`<h3>${esc(title)}</h3><p class="note" style="margin:0">${esc(text)}</p>
      <div class="actions"><button class="btn" id="cfNo">取消</button><button class="btn dark" id="cfYes">${esc(okLabel||'確定')}</button></div>`);
    $('#cfNo').onclick=()=>{ closeModal(); res(false); };
    $('#cfYes').onclick=()=>{ closeModal(); res(true); };
  });
}
$('#bindBtn').onclick = async () => {
  const id=$('#bindEmp').value, pin=$('#bindPin').value.trim(), e=$('#bindErr');
  e.classList.add('hidden');
  const fail=m=>{ e.textContent=m; e.classList.remove('hidden'); };
  if(!id) return fail('請先選擇自己的名字');
  if(!/^\d{4,8}$/.test(pin)) return fail('請輸入 4–8 位數字的 PIN');
  const name=$('#bindEmp').selectedOptions[0].textContent;
  if(!(await askConfirm(`把你的 LINE 綁定給「${name}」？`, '綁定後只能用這個 LINE 帳號替這位員工打卡。', '確定綁定'))) return;
  const b=$('#bindBtn'); b.disabled=true; b.textContent='綁定中…';
  try{
    const r=await api('bind',{ empId:id, pin });
    me=r.me; $('#bindPin').value=''; $('#bindInfo').classList.add('hidden');
    showStatus(); only('punchCard'); toast('綁定完成');
  }catch(err){ fail(String(err.message||err)); }
  finally{ b.disabled=false; b.textContent='綁定'; }
};
$('#bindPin').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#bindBtn').click(); });

/* 打卡 */
function showStatus(){
  const s=me.shift;
  $('#whoName').textContent=me.name;
  $('#whoShift').textContent='今天：'+(s?s.name+(s.start?` ${s.start}–${s.end}`:''):'沒有排班');
  $('#tIn').textContent=me.inTime||'--:--';
  $('#tOut').textContent=me.outTime||'--:--';
  const g=$('#gpsHint');
  g.classList.toggle('hidden', !(info&&info.gps));
  g.textContent = me.locs && me.locs.length ? '可打卡地點：'+me.locs.join('、') : '需要開啟定位，只能在打卡地點附近打卡';
  const b=$('#clockBtn'); b.textContent=me.next+'打卡'; b.className='btn big '+(me.next==='上班'?'primary':'dark');
}
function showResult(ok,title,sub){ const r=$('#result'); r.className='result '+(ok?'ok':'err'); r.innerHTML=`<b>${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:''}`; }
function getPos(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation) return rej('這支手機不支援定位');
    navigator.geolocation.getCurrentPosition(p=>res(p.coords), e=>rej(e.code===1?'請允許 LINE 使用定位（手機設定 → LINE → 位置）後再打卡':'抓不到定位，請開啟 GPS 再試'),{enableHighAccuracy:true,timeout:12000,maximumAge:0});
  });
}
$('#clockBtn').onclick = async () => {
  if(!me) return;
  const b=$('#clockBtn'); b.disabled=true; const label=b.textContent; b.textContent='打卡中…';
  try{
    let lat=null,lng=null;
    if(info.gps){ b.textContent='取得定位中…'; const c=await getPos(); lat=c.latitude; lng=c.longitude; b.textContent='打卡中…'; }
    const r=await api('clock',{lat,lng});
    const sub=[r.status!=='正常'?(r.note||r.status):'', r.dist!==''?`${r.loc||'公司'}，距離 ${r.dist} 公尺`:''].filter(Boolean).join('，');
    showResult(true, `${r.type}打卡完成　${r.time}`, sub);
    me=r.me; showStatus();
  }catch(err){
    const m=String(err.message||err);
    if(m.startsWith('UNBOUND:')){ const i=$('#bindInfo'); i.textContent=m.slice(8); i.classList.remove('hidden'); me=null; start(); return; }
    showResult(false, m); b.textContent=label;
  }finally{ b.disabled=false; }
};

start();
</script>
</body>
</html>
